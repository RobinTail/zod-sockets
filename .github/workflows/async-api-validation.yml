name: AsyncAPI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: none
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Validate AsyncAPI document
      uses: asyncapi/cli@v6.0.2
      with:
        command: validate
        filepath: example/example-documentation.yaml
